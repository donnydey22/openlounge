plugins {
    id 'com.android.application'
    // FCM: reads app/google-services.json (Firebase project open-lounge-2aabd)
    id 'com.google.gms.google-services'
}

// Release signing — two sources, first match wins:
//   1) Environment (CI / the new upload key):  OPENLOUNGE_RELEASE_STORE_FILE, OPENLOUNGE_RELEASE_STORE_PASSWORD,
//      OPENLOUNGE_RELEASE_KEY_ALIAS, OPENLOUNGE_RELEASE_KEY_PASSWORD  (e.g. `set -a; . ~/.secrets/openlounge-release.env`).
//      This is the RSA-4096 release key (~/.secrets/openlounge-release.jks). NOTE: an APK signed with it will NOT install
//      over builds signed with the old key — switch only for a fresh distribution (Play / new package install).
//   2) android/keystore.properties (never committed) → storeFile/storePassword/keyAlias/keyPassword. It points at the
//      key that signed every APK Donny has installed (0.2.1 and earlier), so updates install in place and keep data.
// Neither present → release builds are unsigned (assembleRelease still works; the APK just can't be installed).
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def envSigning = ['OPENLOUNGE_RELEASE_STORE_FILE', 'OPENLOUNGE_RELEASE_STORE_PASSWORD', 'OPENLOUNGE_RELEASE_KEY_ALIAS', 'OPENLOUNGE_RELEASE_KEY_PASSWORD']
        .every { System.getenv(it) }
def hasSigning = envSigning || keystorePropsFile.exists()

android {
    namespace 'com.donnydey.openlounge'
    compileSdk 34

    defaultConfig {
        applicationId "com.donnydey.openlounge"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "0.2.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (envSigning) {
                storeFile file(System.getenv('OPENLOUNGE_RELEASE_STORE_FILE'))
                storePassword System.getenv('OPENLOUNGE_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('OPENLOUNGE_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('OPENLOUNGE_RELEASE_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            } else if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled false
            // no applicationIdSuffix: the sideloaded debug APK installs as com.donnydey.openlounge
        }
        release {
            minifyEnabled false
            debuggable false
            if (hasSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'

    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
