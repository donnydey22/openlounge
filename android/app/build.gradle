plugins {
    id 'com.android.application'
    // FCM: reads app/google-services.json (Firebase project open-lounge-2aabd)
    id 'com.google.gms.google-services'
}

// Release signing: android/keystore.properties (never committed) → storeFile/storePassword/keyAlias/keyPassword.
// It points at the key that signed every APK Donny has installed (0.2.1 and earlier), so updates install in place
// over the existing app — and keep its data, i.e. nobody is signed out by the update.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.donnydey.openlounge'
    compileSdk 34

    defaultConfig {
        applicationId "com.donnydey.openlounge"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "0.2.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled false
            // no applicationIdSuffix: the sideloaded debug APK installs as com.donnydey.openlounge
        }
        release {
            minifyEnabled false
            debuggable false
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'

    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
