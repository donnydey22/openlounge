name: pjsip-server-wasm
on: { push: { branches: [pjsip-rebuild] }, workflow_dispatch: {} }
jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd call-signal && npm install --no-audit --no-fund && npm test
      - run: cd ws-media-relay && npm install --no-audit --no-fund && npm test
      - run: cd media-sfu && npm install --no-audit --no-fund && node --test test/plain.test.mjs
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: 3.1.74, actions-cache-folder: "" }
      - run: wasm-call/build.sh
      - run: cd ws-media-relay && npm install --no-audit --no-fund
      - run: cd wasm-call && npm install --no-audit --no-fund && npm test
      - name: no WebRTC in browser call path
        run: "! grep -rEn 'RTCPeerConnection|webrtc' wasm-call/src ws-media-relay/src"
      - uses: actions/upload-artifact@v4
        with: { name: olwasm, path: wasm-call/dist }
  matrix:
    needs: [server, wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: olwasm, path: wasm-call/dist }
      - run: node --test tests/pjsip-matrix/matrix.test.mjs
      - run: for d in media-sfu ws-media-relay tests/pjsip-matrix; do (cd $d && npm install --no-audit --no-fund); done
      - name: browser cells (headless Google Chrome, real mediasoup PlainTransport, WS relay, 30 s + redial)
        run: google-chrome --version && CELL_SECONDS=30 node tests/pjsip-matrix/run-browser.mjs
      - name: phone engine SFU leg on Linux (ol_sfu.c, same source as iOS/Android) <-> headless browser, sanity only
        continue-on-error: true
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libopus-dev
          git clone -q --depth 1 -b 2.17 https://github.com/pjsip/pjproject.git /tmp/pjproject
          cd /tmp/pjproject && echo '#define PJMEDIA_HAS_SRTP 1' > pjlib/include/pj/config_site.h
          ./configure --disable-video --disable-sound --with-opus --disable-ssl >/dev/null && make dep >/dev/null 2>&1 && make -j4 >/dev/null
          cd $GITHUB_WORKSPACE/tests/pjsip-matrix/engine
          printf 'include /tmp/pjproject/build.mak\nall:\n\tgcc -O2 -o olsfu_cli olsfu_cli.c ol_sfu.c $(PJ_CFLAGS) $(PJ_LDFLAGS) $(PJ_LDLIBS) -lm\n' > Makefile.ci && make -f Makefile.ci
          cd $GITHUB_WORKSPACE && PHONE=linux CELL_SECONDS=20 node tests/pjsip-matrix/run-phone.mjs
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: "matrix-*", path: tests/pjsip-matrix/results, merge-multiple: true }
      - name: merge iPhone + Android cell results (latest completed pjsip-rebuild run in each repo)
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for x in "openlounge-ios ios-xcframework.yml matrix-ios" "openlounge-android android-prefab.yml matrix-android"; do
            set -- $x; id=$(gh run list -R donnydey22/$1 -b pjsip-rebuild -w $2 -s completed -L 1 --json databaseId -q '.[0].databaseId')
            echo "$1 run $id"; [ -n "$id" ] && gh run download $id -R donnydey22/$1 -n $3 -D tests/pjsip-matrix/results || echo "no $3 artifact"
          done
      - name: must-pass matrix report (ship gate reported, not enforced on branch CI)
        run: node tests/pjsip-matrix/matrix.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: matrix-results, path: tests/pjsip-matrix/results }
