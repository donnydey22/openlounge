# Included by every /media location: CORS preflight, method gate, signed-link check (hits included), X-Cache-Status.
error_page 403 = @forbidden;
error_page 405 = @method;
if ($request_method = OPTIONS) {
  add_header Access-Control-Allow-Origin * always;
  add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
  add_header Access-Control-Allow-Headers Range always;
  add_header Access-Control-Max-Age 86400 always;
  add_header Cache-Control no-store always;
  return 204;
}
if ($request_method !~ ^(GET|HEAD)$) { return 405; }
if ($media_auth !~ ^(ok|gone)$) { return 403; }
add_header X-Cache-Status $cache_status always;
